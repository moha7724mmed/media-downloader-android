name: Build Media Downloader APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null || true

      
      - name: Build QuickJS for Android arm64
        shell: bash
        run: |
          set -e

          git clone --depth 1 --branch v0.15.1 \
            https://github.com/quickjs-ng/quickjs.git quickjs-ng

          cmake -S quickjs-ng -B quickjs-ng/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DQJS_BUILD_LIBC=ON

          cmake --build quickjs-ng/build --target qjs_exe -j2

          echo "=== Searching for QuickJS executable ==="
          find quickjs-ng/build -type f -name qjs -print

          QJS_BIN="$(find quickjs-ng/build -type f -name qjs -perm -111 | head -n 1)"

          if [ -z "$QJS_BIN" ]; then
            echo "ERROR: QuickJS executable was not found."
            echo "=== Build directory ==="
            find quickjs-ng/build -maxdepth 4 -type f -print
            exit 1
          fi

          echo "QuickJS found at:"
          echo "$QJS_BIN"

          mkdir -p src/assets/bin
          cp "$QJS_BIN" src/assets/bin/qjs
          chmod +x src/assets/bin/qjs

          echo "=== QuickJS binary ==="
          file src/assets/bin/qjs
          ls -lh src/assets/bin/qjs

      - name: Add FFmpeg for Android arm64
        run: |
          mkdir -p /tmp/ffmpeg
          curl -L --fail --retry 3 \
            -o /tmp/ffmpeg/ffmpeg.zip \
            https://github.com/Tyrrrz/FFmpegBin/releases/download/8.1.2/ffmpeg-android-arm64.zip
          echo "85210691e06cd02025fbc9a698da2495537ae61175e9a1afe66a046835e00380  /tmp/ffmpeg/ffmpeg.zip" | sha256sum -c -
          unzip -q /tmp/ffmpeg/ffmpeg.zip -d /tmp/ffmpeg/out
          FF_BIN=$(find /tmp/ffmpeg/out -type f -name ffmpeg | head -n 1)
          test -n "$FF_BIN"
          cp "$FF_BIN" src/assets/bin/ffmpeg
          chmod +x src/assets/bin/ffmpeg
          file src/assets/bin/ffmpeg

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.86.2

      - name: Build APK
        run: flet build apk --arch arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-APK
          path: build/apk/*.apk
          if-no-files-found: error
